name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply.
        required: true
        default: patch
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check release eligibility
        id: eligibility
        run: |
          message="$(git log -1 --format=%B)"
          release=true
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [[ "$message" == *"[skip release]"* || "$message" == chore\(release\):* ]]; then
              release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.eligibility.outputs.release == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Use Rust stable
        if: steps.eligibility.outputs.release == 'true'
        run: rustup default stable

      - uses: actions/setup-node@v4
        if: steps.eligibility.outputs.release == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Configure Git author
        if: steps.eligibility.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        if: steps.eligibility.outputs.release == 'true'
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_MESSAGE: ${{ steps.eligibility.outputs.message }}
        run: |
          version="$(node scripts/release-version.mjs next --bump "$RELEASE_BUMP" --message "$RELEASE_MESSAGE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Apply lockstep version
        if: steps.eligibility.outputs.release == 'true'
        run: |
          node scripts/release-version.mjs apply "${{ steps.version.outputs.version }}"
          cargo update -w
          npm install --prefix typescript --package-lock-only --ignore-scripts
          node scripts/release-version.mjs check "${{ steps.version.outputs.version }}"

      - name: Install TypeScript dependencies
        if: steps.eligibility.outputs.release == 'true'
        run: npm ci --prefix typescript

      - name: Commit and push release version
        if: steps.eligibility.outputs.release == 'true'
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No release version changes to commit"
            exit 0
          fi
          git add Cargo.toml Cargo.lock durust-macros/Cargo.toml benchtools/Cargo.toml typescript/package-lock.json typescript/packages
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip release]"
          git push origin HEAD:main

      - name: Publish crates
        if: steps.eligibility.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          crate_exists() {
            local crate="$1"
            curl -fsSL -H "User-Agent: durust-release-ci" "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null 2>&1
          }

          publish_crate() {
            local crate="$1"
            if crate_exists "$crate"; then
              echo "${crate} ${VERSION} is already published"
              return
            fi
            cargo publish --locked -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
          }

          publish_crate durust-macros

          for attempt in {1..24}; do
            if crate_exists durust-macros; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "durust-macros ${VERSION} did not become visible on crates.io" >&2
              exit 1
            fi
            sleep 10
          done

          publish_crate durust

      - name: Publish npm packages
        if: steps.eligibility.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC request environment is missing" >&2
            exit 1
          fi

          publish_package() {
            local package="$1"
            if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package} ${VERSION} is already published"
              return
            fi
            npm publish --prefix typescript --workspace "$package"
          }

          publish_package @durust/core
          publish_package @durust/payload
          publish_package @durust/sqlite
          publish_package @durust/postgres
          publish_package @durust/testing
          publish_package @durust/eslint-plugin
