name: CI

# `push` is restricted to `main`; `pull_request` covers everything else. A bare
# `push` alongside `pull_request` ran this entire workflow — both containers, the
# full test suite, the S3 conformance step — **twice** for every push to a
# branch with an open PR. Same commit, same result, double the minutes.
#
# `push` cannot simply be dropped, and this is the trap: `release.yml` triggers
# on `workflow_run` of this workflow and gates on
# `github.event.workflow_run.event == 'push'` and `head_branch == 'main'`.
# Removing the push trigger, or filtering `main` out of it, silently stops every
# release while leaving CI green.
on:
  pull_request:
  push:
    branches:
      - main

# Cancellation is scoped to pull requests, because on `main` a cancelled run is a
# *skipped release*: `release.yml` keys off this workflow's conclusion, and a
# release's version bump is derived from that one commit, so losing the run loses
# the bump rather than deferring it.
#
# `cancel-in-progress: false` is **not** sufficient on its own, which is why the
# group key differs by event. That setting governs only runs already executing; a
# run queued into an occupied group becomes *pending*, and GitHub cancels a
# previously pending run in the group regardless. With a single `ci-refs/heads/main`
# group, three pushes to `main` inside one CI duration would cancel the middle
# one and silently skip its release. Keying pushes by commit sha gives each its
# own group, so they queue independently; pull requests keep a per-ref group so
# that superseding a PR push still cancels the run it replaces.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Formatting, lints, and the feature combinations that omit sqlite. None of it
  # needs a database, Node, or Docker, and it is the feedback a broken push
  # wants first, so it no longer queues behind the test suite.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


      - name: Install Rust
        run: rustup toolchain install stable --profile minimal


      - name: Use Rust stable
        run: rustup default stable

      # Nothing cached the Rust build before this, and that is where the wall
      # clock went: a green run compiled the workspace from scratch for clippy,
      # for the sqlite-free feature checks, for the test binaries, and again in
      # `release` for the addon. On the run this replaced, `Run tests` took
      # 281 s of which ~20 s was executing tests, and building the addon took a
      # further 148 s.
      #
      # The action keys on the job, so the jobs below keep separate entries
      # rather than one they would thrash: the `dev` test artifacts and the
      # addon's `release` artifacts share no output.
      - uses: Swatinem/rust-cache@v2


      - name: Check formatting
        run: cargo fmt --all --check


      - name: Clippy
        # `result_large_err` is allowed on purpose: `durust::Error` carries a
        # payload, and boxing it would change the public `Result` alias.
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings -A clippy::result_large_err


      # This step was named "Check feature matrix" and ran two lines, one of
      # which was redundant: `default = ["sqlite"]`, so `--features postgres,s3`
      # *also* enables sqlite and is therefore identical to `--all-features` —
      # which the "Run tests" step below already builds and, unlike `cargo
      # check`, actually runs. The name claimed a matrix that neither line
      # covered.
      #
      # What is genuinely distinct is the sqlite-free half: a dependent taking
      # durust with only Postgres, or only S3, gets a crate this workflow never
      # compiled. All four combinations below pass today — the point of pinning
      # them is that a `rusqlite` type leaking into a non-sqlite code path now
      # fails here rather than at a user's `cargo build`.
      #
      # Library only, deliberately. `--no-default-features --all-targets`
      # currently produces 70 errors, because the test suite's helpers construct
      # `SqliteBackend` unguarded. That is a real gap, recorded here rather than
      # hidden: putting thousands of lines of test code behind
      # `#[cfg(feature = "sqlite")]` is a larger change than this step should
      # smuggle in, and a `cargo check` that silently covered only the lib while
      # being named for the whole matrix is how the previous version misled.
      - name: Check library across sqlite-free feature combinations
        run: |
          cargo check --locked --no-default-features
          cargo check --locked --no-default-features --features postgres
          cargo check --locked --no-default-features --features s3
          cargo check --locked --no-default-features --features postgres,s3

  # The Rust suite, plus the steps that reuse the workspace it compiles: the
  # S3 conformance case, the examples, and the benchmark build.
  rust-test:
    runs-on: ubuntu-latest

    # Both runtimes' Postgres suites are environment-gated, and before this
    # container neither of them ran here: Rust's 55 gated tests executed and
    # skipped (libtest captures the skip notice, so they reported plain `ok`),
    # and TypeScript's 123 never executed at all, because the only script that
    # invokes them — `check:postgres` — hangs off `check:release`, which no
    # workflow calls. The container plus `DURUST_REQUIRE_POSTGRES` below turns
    # "no database" from a silent pass into a failure.
    #
    # The image tracks the local development container so a CI-only Postgres
    # version difference cannot be the reason a test disagrees with a laptop.
    # The port is the in-container default; only the local fixture uses 5433.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durust"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4


      - name: Install Rust
        run: rustup toolchain install stable --profile minimal


      - name: Use Rust stable
        run: rustup default stable

      # Nothing cached the Rust build before this, and that is where the wall
      # clock went: a green run compiled the workspace from scratch for clippy,
      # for the sqlite-free feature checks, for the test binaries, and again in
      # `release` for the addon. On the run this replaced, `Run tests` took
      # 281 s of which ~20 s was executing tests, and building the addon took a
      # further 148 s.
      #
      # The action keys on the job, so the jobs below keep separate entries
      # rather than one they would thrash: the `dev` test artifacts and the
      # addon's `release` artifacts share no output.
      - uses: Swatinem/rust-cache@v2


      # `DURUST_REQUIRE_POSTGRES` turns every Postgres skip site in the Rust
      # suite into a panic, so this step fails if the service container, the
      # URL, or the database goes away. Without it the same command reports
      # `ok` for 55 tests that never touched a database.
      - name: Test default-feature library
        run: cargo test --locked --lib

      - name: Run tests
        env:
          DURUST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/durust
          DURUST_REQUIRE_POSTGRES: "1"
        run: cargo test --locked --workspace --all-features

      - name: Start the S3 fixture
        run: docker compose -f tests/fixtures/s3proxy.compose.yml up -d

      # `DURUST_REQUIRE_S3` is to this step what `DURUST_REQUIRE_POSTGRES` is to
      # the two above: without it the conformance case skips on missing
      # variables and reports `ok. 1 passed`, so the step's greenness never
      # depended on the object store being reachable. The compose service and
      # the six variables below meant it did genuinely run — but a container
      # that fails to become ready, or one dropped variable, would have gone
      # unnoticed.
      #
      # The filter is the substring `s3`, not a full test name. `cargo test`
      # with a filter that matches nothing prints `0 passed` and exits 0, so
      # naming a single test meant that dropping `--features s3`, or renaming
      # that test, left this step green having run nothing at all. `s3` also
      # matches `s3_feature_is_enabled_when_s3_is_required`, which is compiled
      # unconditionally — so the filter can never match zero tests, and the
      # missing-feature case now fails here instead of passing.
      #
      # `--workspace --all-features` matches the "Run tests" step exactly, and
      # both halves are needed to reuse its build. `--features s3` enables the
      # default `sqlite` but not `postgres`, a different feature set; and
      # dropping `--workspace` is the subtler one, because `--all-features`
      # looks sufficient on its own. It is not: `durust-node` takes `napi` with
      # `tokio_rt`, which enables `tokio/rt-multi-thread`, and that unifies into
      # `durust`'s own tokio only when the addon is in the graph. Without
      # `--workspace` this crate resolves to a different tokio, so it rebuilds
      # `durust` and the 9,600-line conformance binary under a second hash.
      # Measured: 3.79 s to rebuild versus 0.09 s to reuse.
      #
      # Measured with `-- --list`, `--features s3` and `--all-features` select
      # exactly the same three tests — `s3_feature_is_enabled_when_s3_is_required`,
      # `payload_backend_over_sqlite_passes_s3_conformance_when_configured`,
      # and `payload_backend_s3_upload_failure_does_not_commit_missing_payload_ref`
      # — so the wider flag costs no coverage.
      - name: Run S3 conformance
        env:
          DURUST_S3_ENDPOINT: http://127.0.0.1:3900
          DURUST_S3_BUCKET: durust-payloads
          DURUST_S3_REGION: us-east-1
          DURUST_S3_PREFIX: ci/${{ github.run_id }}/${{ github.run_attempt }}
          DURUST_S3_ACCESS_KEY_ID: durust-access-key
          DURUST_S3_SECRET_ACCESS_KEY: durust-secret-key
          DURUST_REQUIRE_S3: "1"
        run: cargo test --locked --workspace --all-features --test provider_conformance s3 -- --nocapture

      - name: Stop the S3 fixture
        if: always()
        run: docker compose -f tests/fixtures/s3proxy.compose.yml down -v


      # Every example is a compiled, running document (`SPEC.md` §22.7).
      #
      # Built by the workspace and then executed, rather than through `cargo run
      # --example`, which takes no `--workspace` and so resolves the features of
      # this crate alone — the same split described above, rebuilding `durust`
      # once more. `cargo build` here is a no-op after "Run tests" (measured at
      # 0.09 s), and the binaries it names are the ones that step already built.
      - name: Run examples
        run: |
          cargo build --locked --workspace --all-features --examples
          for example in examples/*.rs; do
            "target/debug/examples/$(basename "${example%.rs}")"
          done


      - name: Build benchmarks
        run: cargo bench --locked --no-run

  # The TypeScript workspace. It builds the addon from this checkout first,
  # because every provider it tests is the Rust core behind `@durust/native`.
  typescript:
    runs-on: ubuntu-latest

    # Both runtimes' Postgres suites are environment-gated, and before this
    # container neither of them ran here: Rust's 55 gated tests executed and
    # skipped (libtest captures the skip notice, so they reported plain `ok`),
    # and TypeScript's 123 never executed at all, because the only script that
    # invokes them — `check:postgres` — hangs off `check:release`, which no
    # workflow calls. The container plus `DURUST_REQUIRE_POSTGRES` below turns
    # "no database" from a silent pass into a failure.
    #
    # The image tracks the local development container so a CI-only Postgres
    # version difference cannot be the reason a test disagrees with a laptop.
    # The port is the in-container default; only the local fixture uses 5433.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durust"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # `vitest.config.ts` includes `packages/*/test/**/*.test.ts`, so
    # `npm run check` collects `packages/benchmark/test/thresholds.test.ts` and
    # runs its memory and sqlite accepted baselines. Those compare measured
    # throughput and commit latency against numbers recorded on a developer
    # machine, and a shared runner reaches a fraction of them: run 35147978616
    # measured 69.9 mixed actions/s where the baseline's own 0.1 ratio demands
    # 165.9. This lifts those four speed gates for the whole job — no GitHub
    # runner is a performance reference — and leaves every correctness gate in
    # the baselines running: exact counters, worker stats, operation names, and
    # operation errors. The controlled machine below is where speed is judged.
    env:
      DURUST_BENCHMARK_SKIP_SPEED_THRESHOLDS: "1"

    # `DURUST_POSTGRES_URL` is deliberately set per step rather than for the
    # whole job. A job-level variable would also switch on the env-gated
    # Postgres cases in `thresholds.test.ts` inside `npm run check`, which
    # stand up a database per case for a comparison this job does not make.

    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json


      - name: Install Rust
        run: rustup toolchain install stable --profile minimal


      - name: Use Rust stable
        run: rustup default stable

      # Nothing cached the Rust build before this, and that is where the wall
      # clock went: a green run compiled the workspace from scratch for clippy,
      # for the sqlite-free feature checks, for the test binaries, and again in
      # `release` for the addon. On the run this replaced, `Run tests` took
      # 281 s of which ~20 s was executing tests, and building the addon took a
      # further 148 s.
      #
      # The action keys on the job, so the jobs below keep separate entries
      # rather than one they would thrash: the `dev` test artifacts and the
      # addon's `release` artifacts share no output.
      - uses: Swatinem/rust-cache@v2


      - name: Install TypeScript dependencies
        run: npm ci --prefix typescript


      # Every TypeScript provider is the Rust core behind `@durust/native`, so
      # the workspace's tests need the `durust-node` addon built first; `npm
      # run check` does not build it. Release builds come from the platform
      # matrix in `release.yml`; this is the from-source path.
      - name: Build the durust-node addon
        run: npm --prefix typescript run build:native --workspace @durust/native


      # The four platform packages under `packages/native/npm` must agree with
      # the facade on name, version, and the addon file each ships.
      - name: Check the native platform packages
        run: node scripts/check-native-packages.mjs


      # `npm run check` includes `check:fixtures`, the TypeScript half of every
      # shared fixture; the Rust half ran in `cargo test --workspace` above.
      - name: Run TypeScript checks
        run: npm run check --prefix typescript


      # Every test `PARITY.md` cites must still exist on both sides.
      - name: Check PARITY.md test citations
        run: node scripts/check-parity-names.mjs


      # `npm run check` runs `npm run test`, which *does* collect this file —
      # `vitest.config.ts` includes `packages/*/test/**/*.test.ts`. It reaches
      # it and skips it, because the suite is `describe.skip` without
      # `DURUST_POSTGRES_URL`, and a fully skipped file still exits 0. So the
      # cases were never executed in CI, and the only script that would have
      # executed them, `check:postgres`, hangs off `check:release`, which no
      # workflow invokes. Same for the hot-cache soak below.
      #
      # This runs the conformance file directly rather than `npm run
      # check:postgres`, because that script also runs
      # `test:benchmark-thresholds` — see the note below it.
      #
      # `DURUST_REQUIRE_POSTGRES` is the same flag the Rust suite uses, and the
      # TypeScript side honours it: both files below call
      # `assertPostgresAvailableWhenRequired` at module scope, which throws on
      # a missing URL. The conformance file runs the shared cases over the
      # Rust Postgres provider through `@durust/native`.
      #
      # The `test -n` guard stays, and is not redundant, because it covers the
      # one case the assertion cannot. Delete this `env:` block and
      # `DURUST_REQUIRE_POSTGRES` goes with it — so the assertion sees "not
      # required", skips quietly, and the step is green. The guard fires on
      # exactly that edit. It is narrow, and that narrowness is the point;
      # it is not the general protection it used to be described as.
      #
      # `database-guard.test.ts` is listed because nothing else in CI ran it.
      # `npm run check` collects it and skips it (no URL at job level, by
      # design — see the note at the top), the conformance step named only the
      # other file, and `check:postgres` is not invoked here at all. That left
      # its seven cases — the guard in front of `drop database`, the only
      # unrecoverable statement this repository issues — ungated, while its
      # Rust twin in `benchtools` ran on every push.
      - name: Run TypeScript Postgres conformance and database guard
        env:
          DURUST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/durust
          DURUST_REQUIRE_POSTGRES: "1"
        run: |
          test -n "$DURUST_POSTGRES_URL" || {
            echo "DURUST_POSTGRES_URL must be set: without it every case in these files is skipped and the step still passes"
            exit 1
          }
          npm run test --prefix typescript -- \
            packages/native/test/native-conformance.test.ts \
            packages/benchmark/test/database-guard.test.ts


      # `DURUST_LONG_SOAK=1` adds exactly one case to the simulation suite
      # (16 tests instead of 15 passed + 1 skipped) and costs ~90 ms of the
      # run's 0.6 s wall clock, measured. There is no reason for something that
      # cheap to live outside CI.
      #
      # `DURUST_REQUIRE_LONG_SOAK` is set *here* rather than in `test:soak`,
      # which supplies `DURUST_LONG_SOAK`. Two sources, so the check can catch
      # something: if the script ever stops enabling the soak, this step fails
      # instead of quietly reporting `1 skipped` and exiting 0.
      - name: Run TypeScript hot execution cache soak
        env:
          DURUST_REQUIRE_LONG_SOAK: "1"
        run: npm run test:soak --prefix typescript


      # Deliberately **not** run here, and this is the decision rather than an
      # omission: `npm run test:benchmark-thresholds` adds the Postgres
      # baselines to the memory and sqlite ones `npm run check` already runs,
      # and it is the entry point where throughput and latency are the gate.
      # Performance baselines belong on a controlled machine; they stay in
      # `npm run check:postgres` for that use, which refuses to start with
      # `DURUST_BENCHMARK_SKIP_SPEED_THRESHOLDS` set. Its accepted-baseline
      # case asserts `postgres_stats.statementStats` only when
      # `DURUST_REQUIRE_POSTGRES_STATEMENT_STATS=1`, because that needs a
      # server started with `shared_preload_libraries=pg_stat_statements`,
      # which a GitHub service container cannot supply (`services:` cannot
      # override the image's command).
      #
      # The controlled machine is what `tests/fixtures/postgres.compose.yml` is
      # for, and it was the only file in the repository nothing referenced by
      # name. It is the *only* Postgres in this project started with
      # `shared_preload_libraries=pg_stat_statements`, which is precisely the
      # setting a `services:` container cannot supply — so it is the supported
      # way to run the step this block declines to run:
      #
      #   docker compose -f tests/fixtures/postgres.compose.yml up -d
      #   DURUST_POSTGRES_URL=postgres://durable:durable@localhost:55432/durable \
      #     npm run check:postgres --prefix typescript
      #
      # Note the port and credentials: `55432` and `durable/durable/durable`,
      # which match neither this workflow nor the `5433` /
      # `postgres/postgres/durust` container used for ordinary local runs. That
      # is deliberate — it is a separate, benchmark-only database — but it is
      # easy to mistake for the everyday one, so the full URL is spelled out
      # above rather than left to be inferred.

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri

      # Gates one invariant: `with_context` / `with_activity_context` never
      # produce two live borrows of a runtime context, and always restore the
      # thread-local slot, including when the guarded call unwinds. Aliasing
      # there is unobservable without Miri and the crate's most safety-critical
      # unsafe block depends on it. This job does not claim the rest of the
      # crate is free of undefined behavior.
      #
      # The scope is deliberate, not a placeholder:
      #   - `--no-default-features` drops `sqlite`, because rusqlite is C FFI
      #     and Miri cannot execute foreign functions.
      #   - The filter stays on `runtime::tests` because the whole lib test
      #     binary does not finish. Under Miri's default isolation it aborts in
      #     `payload_backend::tests`, which reaches `SystemTime::now()` through
      #     `provider_util::unix_epoch_millis` (`src/provider_util.rs:312`) —
      #     an unsupported `clock_gettime` operation, not undefined behavior.
      #     With `-Zmiri-disable-isolation` it clears that and then spends
      #     unbounded time interpreting the many-seed `sim::tests` scenarios
      #     (still running after 25 minutes locally).
      # Nothing cached the Rust build before this, and that is where the wall
      # clock went: a green run compiled the workspace from scratch for clippy,
      # for the sqlite-free feature checks, for the test binaries, and again in
      # `release` for the addon. On the run this replaced, `Run tests` took
      # 281 s of which ~20 s was executing tests, and building the addon took a
      # further 148 s.
      #
      # The action keys on the job, so the jobs below keep separate entries
      # rather than one they would thrash: the `dev` test artifacts and the
      # addon's `release` artifacts share no output.
      - uses: Swatinem/rust-cache@v2

      - name: Run Miri over the runtime context-borrow tests
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly miri test --locked --lib --no-default-features -- runtime::tests
