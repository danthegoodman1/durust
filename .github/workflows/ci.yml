name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Both runtimes' Postgres suites are environment-gated, and before this
    # container neither of them ran here: Rust's 55 gated tests executed and
    # skipped (libtest captures the skip notice, so they reported plain `ok`),
    # and TypeScript's 123 never executed at all, because the only script that
    # invokes them — `check:postgres` — hangs off `check:release`, which no
    # workflow calls. The container plus `DURUST_REQUIRE_POSTGRES` below turns
    # "no database" from a silent pass into a failure.
    #
    # The image tracks the local development container so a CI-only Postgres
    # version difference cannot be the reason a test disagrees with a laptop.
    # The port is the in-container default; only the local fixture uses 5433.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durust"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # `DURUST_POSTGRES_URL` is deliberately set per step rather than for the
    # whole job. `vitest.config.ts` includes `packages/*/test/**/*.test.ts`, so
    # a job-level variable would also switch on the env-gated Postgres cases in
    # `packages/benchmark/test/thresholds.test.ts` inside `npm run check` — and
    # those are throughput comparisons against baselines recorded on one
    # developer machine, plus a hard `statementStats` assertion that needs
    # `pg_stat_statements` preloaded. See the benchmark-threshold note below.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Use Rust stable
        run: rustup default stable

      - name: Install TypeScript dependencies
        run: npm ci --prefix typescript

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check feature matrix
        run: |
          cargo check --locked --no-default-features
          cargo check --locked --features postgres,s3

      # `DURUST_REQUIRE_POSTGRES` turns every Postgres skip site in the Rust
      # suite into a panic, so this step fails if the service container, the
      # URL, or the database goes away. Without it the same command reports
      # `ok` for 55 tests that never touched a database.
      - name: Run tests
        env:
          DURUST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/durust
          DURUST_REQUIRE_POSTGRES: "1"
        run: cargo test --locked --workspace --all-features

      # The Rust half of every shared contract fixture, named so a failure
      # points at the cross-language contract rather than at "some test".
      # `cargo test --workspace` above already covers these; running them
      # again here costs seconds and means the corpus is gated by a step whose
      # name says what it gates.
      - name: Run shared contract fixtures (Rust)
        run: |
          cargo test --locked --test contract_fixtures
          cargo test --locked --test map_transitions
          cargo test --locked --test behavioral_corpus
          cargo test --locked --lib worker::tests::maintenance_jitter_matches_the_shared_corpus_table

      # `npm run check` includes `check:fixtures`, which runs both halves of
      # every shared fixture: the TypeScript runners and, through `cargo`, the
      # Rust ones. Before Phase 7 `check:fixtures` existed but was invoked by
      # nothing — not by `npm run check`, not by this workflow — so the shared
      # corpus was ungated in CI.
      - name: Run TypeScript checks
        run: npm run check --prefix typescript

      # `npm run check` runs `npm run test`, which *does* collect this file —
      # `vitest.config.ts` includes `packages/*/test/**/*.test.ts`. It reaches
      # it and skips it, because the suite is `describe.skip` without
      # `DURUST_POSTGRES_URL`, and a fully skipped file still exits 0. So the
      # cases were never executed in CI, and the only script that would have
      # executed them, `check:postgres`, hangs off `check:release`, which no
      # workflow invokes. Same for the hot-cache soak below.
      #
      # This runs the conformance file directly rather than `npm run
      # check:postgres`, because that script also runs
      # `test:benchmark-thresholds` — see the note below it.
      #
      # `DURUST_REQUIRE_POSTGRES` is the same flag the Rust suite uses, and the
      # TypeScript side now honours it: both files below call
      # `assertPostgresAvailableWhenRequired` at module scope, which throws on
      # a missing URL. Measured: require set with no URL exits 1.
      #
      # The `test -n` guard stays, and is not redundant, because it covers the
      # one case the assertion cannot. Delete this `env:` block and
      # `DURUST_REQUIRE_POSTGRES` goes with it — so the assertion sees "not
      # required", skips quietly, and the step is green. The guard fires on
      # exactly that edit. It is narrow, and that narrowness is the point;
      # it is not the general protection it used to be described as.
      #
      # `database-guard.test.ts` is listed because nothing else in CI ran it.
      # `npm run check` collects it and skips it (no URL at job level, by
      # design — see the note at the top), the conformance step named only the
      # other file, and `check:postgres` is not invoked here at all. That left
      # its seven cases — the guard in front of `drop database`, the only
      # unrecoverable statement this repository issues — ungated, while its
      # Rust twin in `benchtools` ran on every push.
      - name: Run TypeScript Postgres conformance and database guard
        env:
          DURUST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/durust
          DURUST_REQUIRE_POSTGRES: "1"
        run: |
          test -n "$DURUST_POSTGRES_URL" || {
            echo "DURUST_POSTGRES_URL must be set: without it every case in these files is skipped and the step still passes"
            exit 1
          }
          npm run test --prefix typescript -- \
            packages/postgres/test/postgres-conformance.test.ts \
            packages/benchmark/test/database-guard.test.ts

      # `DURUST_LONG_SOAK=1` adds exactly one case to the simulation suite
      # (16 tests instead of 15 passed + 1 skipped) and costs ~90 ms of the
      # run's 0.6 s wall clock, measured. There is no reason for something that
      # cheap to live outside CI.
      #
      # `DURUST_REQUIRE_LONG_SOAK` is set *here* rather than in `test:soak`,
      # which supplies `DURUST_LONG_SOAK`. Two sources, so the check can catch
      # something: if the script ever stops enabling the soak, this step fails
      # instead of quietly reporting `1 skipped` and exiting 0.
      - name: Run TypeScript hot execution cache soak
        env:
          DURUST_REQUIRE_LONG_SOAK: "1"
        run: npm run test:soak --prefix typescript

      # Deliberately **not** run here, and this is the decision rather than an
      # omission: `npm run test:benchmark-thresholds` compares measured
      # throughput and latency against baselines recorded on one developer
      # machine, and its accepted-baseline case additionally asserts
      # `postgres_stats.statementStats` is non-null, which requires the server
      # to have been started with `shared_preload_libraries=pg_stat_statements`
      # — a setting a GitHub service container cannot supply, since `services:`
      # cannot override the image's command. Run against a stock container it
      # fails with `expected null not to be null`, which is a fact about the
      # container rather than about the change under test. Performance
      # baselines belong on a controlled machine; they stay in
      # `npm run check:postgres` for that use.

      - name: Start Garage
        run: docker compose -f tests/fixtures/garage.compose.yml up -d

      # `DURUST_REQUIRE_GARAGE` is to this step what `DURUST_REQUIRE_POSTGRES`
      # is to the two above: without it the conformance case skips on missing
      # variables and reports `ok. 1 passed`, so the step's greenness never
      # depended on Garage being reachable. The compose service and the six
      # variables below meant it did genuinely run — but a container that fails
      # to become ready, or one dropped variable, would have gone unnoticed.
      #
      # The filter is the substring `garage`, not the full test name it used to
      # be. `cargo test` with a filter that matches nothing prints `0 passed`
      # and exits 0, so naming a single test meant that dropping `--features
      # s3`, or renaming that test, left this step green having run nothing at
      # all. `garage` also matches
      # `garage_s3_feature_is_enabled_when_garage_is_required`, which is
      # compiled unconditionally — so the filter can never match zero tests,
      # and the missing-feature case now fails here instead of passing.
      - name: Run Garage S3 conformance
        env:
          DURUST_GARAGE_ENDPOINT: http://127.0.0.1:3900
          DURUST_GARAGE_BUCKET: durust-payloads
          DURUST_GARAGE_REGION: garage
          DURUST_GARAGE_PREFIX: ci/${{ github.run_id }}/${{ github.run_attempt }}
          DURUST_GARAGE_ACCESS_KEY_ID: GK0123456789abcdef0123456789abcdef
          DURUST_GARAGE_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DURUST_REQUIRE_GARAGE: "1"
        run: cargo test --locked --features s3 --test provider_conformance garage -- --nocapture

      - name: Stop Garage
        if: always()
        run: docker compose -f tests/fixtures/garage.compose.yml down -v

      - name: Run examples
        run: |
          cargo run --locked --example hello_activity
          cargo run --locked --example worker_registration

      - name: Build benchmarks
        run: cargo bench --locked --no-run

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri

      # Gates one invariant: `with_context` / `with_activity_context` never
      # produce two live borrows of a runtime context, and always restore the
      # thread-local slot, including when the guarded call unwinds. Aliasing
      # there is unobservable without Miri and the crate's most safety-critical
      # unsafe block depends on it. This job does not claim the rest of the
      # crate is free of undefined behavior.
      #
      # The scope is deliberate, not a placeholder:
      #   - `--no-default-features` drops `sqlite`, because rusqlite is C FFI
      #     and Miri cannot execute foreign functions.
      #   - The filter stays on `runtime::tests` because the whole lib test
      #     binary does not finish. Under Miri's default isolation it aborts in
      #     `payload_backend::tests`, which reaches `SystemTime::now()` through
      #     `provider_util::unix_epoch_millis` (`src/provider_util.rs:312`) —
      #     an unsupported `clock_gettime` operation, not undefined behavior.
      #     With `-Zmiri-disable-isolation` it clears that and then spends
      #     unbounded time interpreting the many-seed `sim::tests` scenarios
      #     (still running after 25 minutes locally).
      - name: Run Miri over the runtime context-borrow tests
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly miri test --locked --lib --no-default-features -- runtime::tests
